server {
	listen 80;
	root /usr/share/nginx/html;

	# Same headers as vercel.json. The session token lives in localStorage, so an XSS would steal it: CSP limits scripts to this origin.
	# ponytail: Report-Only until checked in the browser (module federation's runtime ships new Function); then rename to Content-Security-Policy.
	add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
	add_header X-Frame-Options DENY always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# SPA: unknown paths fall back to index.html for the client router.
	location / {
		try_files $uri /index.html;
	}
}
